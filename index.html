<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Liv 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope">
      <div class="env-body"></div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="wax-seal"></div>
    </div>
    <div class="env-hint">tap to open</div>
  </div>

  <div class="flower-layer" id="flowerLayer"></div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="photo-frame">
          <div class="washi"></div>
          <img src="photo.jpg" alt="Liv" class="photo-img">
        </div>
        <div class="caption">happy one month, Liv</div>
        <div class="subcaption">tap to turn me over</div>
      </div>
      <div class="card-face card-back">
        <div class="heading">to Liv,</div>
        <div class="message">
          One month in and you're already my favorite part of every day.
          I love how easy it is to be around you, and I can't wait for
          all the little moments still coming our way. Here's to many more. 🤍
        </div>
        <div class="signoff">— [your name]</div>
      </div>
    </div>
    <div class="flip-hint">tap the card to flip it</div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
